[project]
name = "depthc"
version = "0.16.1"
description = "Turn a short reference clip into a Seedance-ready depth video and motion kit, locally on an Apple Silicon Mac"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*"]
requires-python = ">=3.11"
dependencies = [
    # torch>=2.5 is a hard floor: MPS autocast (used by VDA's infer_video_depth)
    # is only correct from 2.5 onward. See PLAN.md §0 pitfall 2.
    "torch>=2.5",
    "torchvision",
    "opencv-python",
    "numpy",
    "einops",
    "easydict",
    "tqdm",
    "huggingface-hub",
    "gradio",
    "typer",
]

# NEVER add xformers (no macOS story; VDA's motion_module.py try/excepts it)
# NEVER add decord (no reliable arm64 macOS wheels; we own our video I/O)

[project.urls]
Repository = "https://github.com/OSideMedia/depth-converter"
Changelog = "https://github.com/OSideMedia/depth-converter/blob/main/CHANGELOG.md"

[tool.uv]
# ponytail: gradio caps pillow<13 while every fix for 39 pillow advisories is 13.0.0. depthc never
# imports PIL itself (gradio and torchvision do), and tests/test_ui.py plus a real `depthc ui`
# launch cover the path it could break. Delete this override when gradio lifts its cap.
override-dependencies = ["pillow>=13.0.0"]

[project.scripts]
depthc = "depthc.cli:app"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["depthc"]

[tool.pytest.ini_options]
# Scoped to tests/ so collection never wanders into vendor/, which ships its own
# CUDA-only test file that errors at import time on any Mac.
testpaths = ["tests"]
markers = [
    "slow: real-model tests (deselect with '-m \"not slow\"')",
    "vendor: imports the vendored VDA checkout without running the model",
]
