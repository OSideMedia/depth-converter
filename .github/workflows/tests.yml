# pytest on every push and PR (audit E-11: Depth Converter had no CI). No path filter —
# a filtered workflow is a bypass unless it names every gate's transitive deps, and this
# repo is small enough that "always" is the cheaper guarantee.
#
# What this runner CANNOT do, said out loud:
#   * It has no MPS and never runs scripts/setup.sh, so vendor/Video-Depth-Anything and
#     checkpoints/video_depth_anything_vits.pth are absent. The nine `slow` real-model tests
#     and the three `vendor` tests (they import the vendored module for the tqdm hook)
#     SELF-SKIP with a reason naming exactly that (tests/conftest.py
#     pytest_collection_modifyitems); `-rs` prints every skip so the count is visible in
#     the log rather than folded into a green tick. Everything else — checks, kit, cli,
#     ui helpers, motion, compare, look, describe, video_io, envelope, docs, gitignore —
#     runs for real against ffmpeg-generated clips. Twelve is the expected skip count (nine
#     slow — seven, plus 2026-09-15's two binding tests: the kit records its binding.txt's
#     hash, and compare prints its measurement before failing on a tampered one; three
#     vendor); a thirteenth means a new test reached the model unmarked and should be
#     looked at.
#   * torch comes from the committed uv.lock. On linux that is the PyPI manylinux wheel,
#     which drags the nvidia-* CUDA runtime packages along; they install fine without a
#     GPU and torch runs on CPU. It is large (several GB), which is why there is no
#     dependency cache: it would exceed the cache budget and thrash.
name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: ffmpeg (tests synthesise their clips with it)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1
      - name: Install from the committed lock (torch → CPU on this runner)
        run: uv sync --frozen
      - name: Tests that need setup.sh's assets (the set that self-skips here — expect 12)
        run: uv run pytest --collect-only -q -m "slow or vendor" tests | tail -1
      - name: pytest (skips printed with their reason)
        run: uv run pytest -q -rs tests
      - name: No invisible code points in tracked text
        # Zero-width, bidi-override, tag and variation-selector characters are the defect
        # class a human reviewer cannot see. .github/scripts/sanitize.py is a byte-for-byte
        # copy of claude-commands' skills/skill-audit/scripts/sanitize.py: never edit it
        # here, re-copy it (sync-warden compares the two before a claude-commands tag).
        # Exit 1 names each hit. Exit 2 means the scan could not finish (a tracked file it
        # cannot read or cannot prove binary), and that fails the job too, by design.
        run: git ls-files -z | xargs -0 python3 .github/scripts/sanitize.py
