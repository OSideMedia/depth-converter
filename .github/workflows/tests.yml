# pytest on every push and PR (audit E-11: Depth Converter had no CI). No path filter —
# a filtered workflow is a bypass unless it names every gate's transitive deps, and this
# repo is small enough that "always" is the cheaper guarantee.
#
# What this runner CANNOT do, said out loud:
#   * It has no MPS and never runs scripts/setup.sh, so vendor/Video-Depth-Anything and
#     checkpoints/video_depth_anything_vits.pth are absent. The eleven `slow` real-model and
#     checkpoint tests and the three `vendor` tests (they import the vendored module for the tqdm hook)
#     SELF-SKIP with a reason naming exactly that (tests/conftest.py
#     pytest_collection_modifyitems); `-rs` prints every skip so the count is visible in
#     the log rather than folded into a green tick. Everything else — checks, kit, cli,
#     ui helpers, motion, compare, look, describe, video_io, envelope, docs, gitignore —
#     runs for real against ffmpeg-generated clips. scripts/check_ci_skips.py holds the
#     expected skips by reason (eleven slow, three vendor, the envelope's age, which only someone
#     with an OSIDE checkout can act on) and fails the job on any other count or reason.
#   * torch comes from the committed uv.lock. On linux that is the PyPI manylinux wheel,
#     which drags the nvidia-* CUDA runtime packages along; they install fine without a
#     GPU and torch runs on CPU. It is large (several GB), which is why there is no
#     dependency cache: it would exceed the cache budget and thrash.
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_handover.py reads PLAN.md from before its amendment, out of history
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: ffmpeg (tests synthesise their clips with it)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1
      - name: Install from the committed lock (torch → CPU on this runner)
        run: uv sync --frozen
      - name: pytest (skips printed with their reason)
        run: uv run pytest -q -rs --junitxml=pytest-report.xml tests
      - name: The run skipped what it was meant to, and nothing else
        run: uv run python scripts/check_ci_skips.py pytest-report.xml
      - name: No invisible code points in tracked text
        # Zero-width, bidi-override, tag and variation-selector characters are the defect
        # class a human reviewer cannot see (ordinary emoji sequences are allowed).
        # .github/scripts/sanitize.py is a byte-for-byte copy of claude-commands'
        # skills/skill-audit/scripts/sanitize.py: never edit it here, re-copy it. The
        # sync-warden registry in claude-commands lists this copy and compares the two.
        # The scanner exits 1 when a file carries a hit (it names the file and the count)
        # and 2 when the scan is incomplete: a tracked file it cannot read or cannot prove
        # binary. Both fail the job (GNU xargs reports either as 123). A new binary type
        # going red here is the scanner asking to be taught that type, in claude-commands.
        run: |
          set -o pipefail
          # "--" ends the options, so a tracked file named --write or --help is a path.
          git ls-files -z | xargs -0 python3 .github/scripts/sanitize.py --
          # Given files one by one, the scanner judges each file's own name and not the
          # directories above it, so every directory name on a tracked path goes through
          # the scanner's own name check here. In a name a TAB, CR or LF is a hit as well.
          # ponytail: glue around that gap, repeated in four repos. When sanitize.py judges
          # the directories of a named file itself (in claude-commands), delete this block.
          python3 -I - <<'PY'
          import os, subprocess, sys
          sys.dont_write_bytecode = True
          sys.path.insert(0, ".github/scripts")
          from sanitize import name_offsets
          listed = subprocess.run(["git", "ls-files", "-z"], check=True, capture_output=True).stdout
          paths = [os.fsdecode(p) for p in listed.split(b"\0") if p]
          if not paths:
              sys.exit("no tracked paths listed: the directory-name check read nothing")
          dirs = set()
          for path in paths:
              parts = path.split("/")
              dirs.update("/".join(parts[:i]) for i in range(1, len(parts)))
          bad = 0
          for d in sorted(dirs):
              name = d.rsplit("/", 1)[-1]
              hits = name_offsets(name)
              if hits:
                  bad += 1
                  points = ", ".join(sorted({f"U+{ord(name[i]):04X}" for i in hits}))
                  print(f"  invisible code point(s) in a directory NAME: {ascii(d)} ({points})")
          print(f"checked {len(dirs)} tracked directory name(s), {bad} with a hit")
          sys.exit(1 if bad else 0)
          PY
