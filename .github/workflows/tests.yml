# pytest on every push and PR (audit E-11: Depth Converter had no CI). No path filter —
# a filtered workflow is a bypass unless it names every gate's transitive deps, and this
# repo is small enough that "always" is the cheaper guarantee.
#
# What this runner CANNOT do, said out loud:
#   * It has no MPS and never runs scripts/setup.sh, so vendor/Video-Depth-Anything and
#     checkpoints/video_depth_anything_vits.pth are absent. The six `slow` real-model tests
#     and the three `vendor` tests (they import the vendored module for the tqdm hook)
#     SELF-SKIP with a reason naming exactly that (tests/conftest.py
#     pytest_collection_modifyitems); `-rs` prints every skip so the count is visible in
#     the log rather than folded into a green tick. Everything else — checks, kit, cli,
#     ui helpers, motion, compare, look, describe, video_io, envelope, docs, gitignore —
#     runs for real against ffmpeg-generated clips. Nine is the expected skip count; a
#     tenth means a new test reached the model unmarked and should be looked at.
#   * torch comes from the committed uv.lock. On linux that is the PyPI manylinux wheel,
#     which drags the nvidia-* CUDA runtime packages along; they install fine without a
#     GPU and torch runs on CPU. It is large (several GB), which is why there is no
#     dependency cache: it would exceed the cache budget and thrash.
name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: ffmpeg (tests synthesise their clips with it)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1
      - name: Install from the committed lock (torch → CPU on this runner)
        run: uv sync --frozen
      - name: Tests that need setup.sh's assets (the set that self-skips here — expect 9)
        run: uv run pytest --collect-only -q -m "slow or vendor" tests | tail -1
      - name: pytest (skips printed with their reason)
        run: uv run pytest -q -rs tests
      - name: No invisible code points in tracked text
        # Zero-width, bidi-override and tag-block characters are the defect class a
        # human reviewer cannot see. Same classes as claude-commands' skill-audit
        # sanitize.py and the explainer repo's selftests.yml; a hit fails the job and
        # names it.
        run: |
          python3 - <<'PY'
          import subprocess, sys
          bad = set(range(0x200B,0x2010)) | set(range(0x2060,0x2065)) | {0xFEFF} | set(range(0x202A,0x202F)) | set(range(0x2066,0x206A)) | set(range(0xE0000,0xE0080))
          files = subprocess.run(["git","ls-files"], capture_output=True, text=True).stdout.split()
          hits = []
          for f in files:
              if f.endswith((".png",".jpg",".jpeg",".gif",".mp4",".mov",".wav",".pdf",".zip",".woff",".woff2",".pth")): continue
              try: txt = open(f, encoding="utf-8").read()
              except (UnicodeDecodeError, OSError): continue
              for i, ch in enumerate(txt):
                  if i == 0 and ch == "\ufeff": continue  # a leading BOM is encoding, not concealment
                  if ord(ch) in bad: hits.append(f"{f}: U+{ord(ch):04X} at offset {i}")
          print(f"scanned {len(files)} tracked file(s); {len(hits)} invisible code point(s)")
          for h in hits[:50]: print("  " + h)
          sys.exit(1 if hits else 0)
          PY
